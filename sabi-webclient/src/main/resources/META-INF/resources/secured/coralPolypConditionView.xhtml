<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
      xmlns:p="http://primefaces.org/ui"
      xmlns:f="http://xmlns.jcp.org/jsf/core">

<f:metadata>
    <f:view locale="#{userSession.locale}" language="#{userSession.language}"
            contentType="text/html" encoding="utf-8"/>
</f:metadata>
<h:head>
    <title>SABI - #{msg['coralstock.polyp.title']}</title>
</h:head>
<h:body>
    <ui:composition template="/template/masterLayout.xhtml">
        <ui:define name="content">

            <div style="margin-bottom:1rem;">
                <h:link outcome="/secured/coralStockView" styleClass="sabi-back-link">
                    &#8592; #{msg['coralstock.list.title']}
                </h:link>
            </div>

            <h2 style="color:#075985; margin-top:0;">#{msg['coralstock.polyp.title']}</h2>

            <h:form id="polypForm">
                <p:messages id="polypMessages" showDetail="true" closable="true"/>

                <!-- History table -->
                <p:dataTable value="#{coralPolypConditionView.polypHistory}"
                             var="obs"
                             rendered="#{not empty coralPolypConditionView.polypHistory}"
                             responsiveLayout="stack" styleClass="p-mt-2">

                    <p:column headerText="#{msg['coralstock.polyp.form.date.label']}">
                        <h:outputText value="#{obs.observedOn}">
                            <f:convertDateTime pattern="dd.MM.yyyy" type="localDate"/>
                        </h:outputText>
                    </p:column>

                    <p:column headerText="#{msg['coralstock.polyp.form.condition.label']}">
                        <h:outputText value="#{msg['coralstock.condition.'.concat(obs.condition.name())]}"/>
                    </p:column>

                    <p:column style="width:5rem; text-align:center;">
                        <p:commandButton icon="pi pi-trash"
                                         styleClass="ui-button-danger"
                                         title="#{msg['coralstock.polyp.delete.button']}"
                                         actionListener="#{coralPolypConditionView.onDeleteObservation(obs)}"
                                         update="@form"/>
                    </p:column>
                </p:dataTable>

                <p:outputLabel value="#{msg['coralstock.polyp.no.entries']}"
                               rendered="#{empty coralPolypConditionView.polypHistory}"
                               style="font-style:italic; color:#64748b;"/>

                <!-- Add new observation -->
                <p:panel header="#{msg['coralstock.polyp.add.button']}" style="margin-top:1rem;">
                    <div class="sabi-form-grid">
                        <p:outputLabel for="newObservedOn" value="#{msg['coralstock.polyp.form.date.label']}"/>
                        <p:datePicker id="newObservedOn"
                                      value="#{coralPolypConditionView.newObservedOn}"
                                      pattern="dd.MM.yyyy" showIcon="true" style="width:100%;"/>

                        <p:outputLabel for="newCondition" value="#{msg['coralstock.polyp.form.condition.label']}"/>
                        <p:selectOneMenu id="newCondition"
                                         value="#{coralPolypConditionView.newCondition}"
                                         style="width:100%;">
                            <f:selectItems value="#{coralPolypConditionView.polypConditions}" var="pc"
                                           itemLabel="#{msg['coralstock.condition.'.concat(pc.name())]}"
                                           itemValue="#{pc}"/>
                        </p:selectOneMenu>
                    </div>
                    <div style="margin-top:0.75rem;">
                        <p:commandButton value="#{msg['coralstock.polyp.add.button']}"
                                         icon="pi pi-plus"
                                         style="background:#065f46; border-color:#065f46; color:#ffffff;"
                                         actionListener="#{coralPolypConditionView.onAddObservation}"
                                         update="@form"/>
                    </div>
                </p:panel>

                <div style="margin-top:1rem;">
                    <p:commandButton value="#{msg['coralstock.cancel.button.label']}"
                                     icon="pi pi-arrow-left"
                                     styleClass="ui-button-secondary"
                                     type="button"
                                     onclick="window.location.href='#{request.contextPath}/secured/coralStockView.xhtml';"/>
                </div>
            </h:form>

        </ui:define>
    </ui:composition>
</h:body>
</html>
