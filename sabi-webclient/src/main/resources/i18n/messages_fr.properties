ipv6info.title.h=SABI – Service IPv6 uniquement
ipv6info.intro.t=SABI est exclusivement accessible via IPv6. Cette page explique ce que cela signifie et pourquoi le service peut ne pas être accessible depuis certains réseaux.
ipv6info.whatis.h=Qu’est-ce qu’IPv6 ?
ipv6info.whatis.t=Internet utilise des adresses pour identifier les appareils – comme des numéros de maison. IPv4 (l’ancienne version) dispose d’environ 4 milliards d’adresses, ce qui ne suffit plus. IPv6 est le successeur avec un nombre d’adresses pratiquement illimité. La plupart des réseaux domestiques, mobiles et fournisseurs d’accès modernes supportent déjà IPv6.
ipv6info.why.h=Pourquoi SABI est-il uniquement accessible via IPv6 ?
ipv6info.why.t=SABI fonctionne sur un serveur domestique qui ne possède qu’une adresse IPv6. IPv6 est l’avenir d’Internet – pour les projets privés, c’est plus simple et plus économique.
ipv6info.corporate.h=Pourquoi ça ne fonctionne pas depuis le réseau d’entreprise ?
ipv6info.corporate.t=De nombreuses entreprises utilisent encore une infrastructure réseau ancienne qui ne supporte qu’IPv4. Les paquets IPv6 y sont souvent bloqués. Certains routeurs domestiques plus anciens peuvent également ne pas atteindre SABI.
ipv6info.mobile.h=Solution : utiliser les données mobiles
ipv6info.mobile.t=Les réseaux mobiles modernes (4G/5G) supportent généralement IPv6. Si SABI n’est pas accessible via Wi-Fi, désactiver le Wi-Fi et utiliser les données mobiles aide habituellement. Vous pouvez aussi vérifier sur <a href="https://test-ipv6.com" target="_blank" style="color:#0369a1;text-decoration:underline;">test-ipv6.com</a>.
ipv6info.back.l=Retour à la page d’accueil

