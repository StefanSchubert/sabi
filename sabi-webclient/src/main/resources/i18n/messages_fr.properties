register.terms_of_usage.t=Bienvenue chez Sabi ! En vous inscrivant et en utilisant notre service, vous acceptez les conditions suivantes :</br>\
<p><b>1. Nature open source du projet</b><br/>\
Sabi est un projet open source dont le code source et la documentation sont disponibles sur GitHub.\
 \
En utilisant le service, vous acceptez que le service soit fourni \u00ab tel quel \u00bb,\
 sans garantie d'aucune sorte.\
</p>\
<p><b>2. Responsabilit\u00e9 de l'utilisateur</b><br/>\
Vous \u00eates responsable de l'utilisation du service et du contenu que vous cr\u00e9ez ou partagez sur notre plateforme.\
 Veuillez utiliser le service uniquement \u00e0 des fins l\u00e9gales.\
<p><b>3. Protection des donn\u00e9es</b><br/>\
Notre politique de confidentialit\u00e9 (conforme au RGPD) d\u00e9crit la mani\u00e8re dont nous traitons vos donn\u00e9es. Vous pouvez la consulter \u00e0 l'adresse <a href="./gdpr.xhtml">RGPD</a></p>\
<p><b>4. Clause de non-responsabilit\u00e9</b><br/>\
Nous d\u00e9clinons toute responsabilit\u00e9 pour les pertes ou dommages pouvant r\u00e9sulter de l'utilisation de Sabi. \
Sabi est fourni en tant que projet open source, sans garantie ni assurance.\
<p><b>5. Modifications des conditions</b><br/>\
Les pr\u00e9sentes conditions d'utilisation peuvent \u00eatre mises \u00e0 jour de temps \u00e0 autre. Veuillez consulter r\u00e9guli\u00e8rement cette page pour vous tenir inform\u00e9 des modifications.\
<p><b>6. Contact</b><br/>\
Si vous avez des questions ou des pr\u00e9occupations, veuillez s\u00e9lectionner \u00ab Commentaires \u00bb dans le menu principal apr\u00e8s vous \u00eatre connect\u00e9. Vous trouverez \u00e9galement mes coordonn\u00e9es dans les <a href="./impressum.xhtml">mentions l\u00e9gales</a>.</b>

