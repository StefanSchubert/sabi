# Google OIDC Privacy Disclosure (Google API Services User Data Policy compliance)
gdpr.google.h=Donn\u00E9es utilisateur Google \u2013 D\u00E9claration de confidentialit\u00E9
gdpr.google.data_accessed.h=Donn\u00E9es consult\u00E9es
gdpr.google.data_accessed.t=Lorsque vous choisissez de vous connecter avec Google, SABI demande les donn\u00E9es suivantes de votre compte Google via OpenID Connect (OIDC)\u00A0:<br/><ul><li><b>Adresse e-mail</b> \u2013 utilis\u00E9e comme identifiant unique de votre compte</li><li><b>Nom d'affichage</b> (nom de profil) \u2013 utilis\u00E9 comme nom d'utilisateur initial</li><li><b>Identifiant OpenID</b> \u2013 un identifiant unique et anonyme pour lier votre compte Google \u00E0 votre compte SABI</li></ul>SABI n'acc\u00E8de <b>pas</b> \u00E0 vos contacts, calendrier, fichiers, photos ou tout autre service Google.
gdpr.google.data_usage.h=Utilisation des donn\u00E9es
gdpr.google.data_usage.t=Les donn\u00E9es Google d\u00E9crites ci-dessus sont utilis\u00E9es exclusivement aux fins suivantes\u00A0:<br/><ul><li><b>Authentification</b> \u2013 pour v\u00E9rifier votre identit\u00E9 et vous connecter</li><li><b>Cr\u00E9ation de compte</b> \u2013 pour cr\u00E9er votre compte SABI lors de la premi\u00E8re connexion</li><li><b>Liaison de compte</b> \u2013 pour associer les connexions Google ult\u00E9rieures \u00E0 votre compte SABI existant</li></ul>SABI n'utilise pas vos donn\u00E9es Google \u00E0 des fins publicitaires, de profilage, d'analyse ou toute autre fin que celles d\u00E9crites ci-dessus.
gdpr.google.data_sharing.h=Partage des donn\u00E9es
gdpr.google.data_sharing.t=SABI ne partage, ne vend, ne loue et ne divulgue <b>pas</b> vos donn\u00E9es Google \u00E0 des tiers. Vos donn\u00E9es sont utilis\u00E9es uniquement au sein de l'application SABI aux fins indiqu\u00E9es ci-dessus. Aucun service d'analyse tiers, r\u00E9seau publicitaire ou courtier en donn\u00E9es ne re\u00E7oit vos donn\u00E9es Google via SABI.
gdpr.google.data_storage.h=Stockage & protection des donn\u00E9es
gdpr.google.data_storage.t=Vos donn\u00E9es Google (e-mail, nom d'affichage, identifiant OpenID) sont stock\u00E9es dans la base de donn\u00E9es SABI, h\u00E9berg\u00E9e sur des serveurs situ\u00E9s dans l'Union europ\u00E9enne.<br/>Les mesures de s\u00E9curit\u00E9 comprennent\u00A0:<ul><li>Transmission chiffr\u00E9e via HTTPS/TLS</li><li>Acc\u00E8s \u00E0 la base de donn\u00E9es limit\u00E9 au backend SABI</li><li>Les tokens OAuth ne sont <b>pas</b> conserv\u00E9s \u2013 ils ne sont utilis\u00E9s que pendant l'authentification puis supprim\u00E9s</li></ul>
gdpr.google.data_retention.h=Conservation & suppression
gdpr.google.data_retention.t=Vos donn\u00E9es Google sont conserv\u00E9es tant que votre compte SABI existe. Vous pouvez demander la suppression compl\u00E8te de votre compte et de toutes les donn\u00E9es associ\u00E9es \u00E0 tout moment en nous contactant \u00E0 <a href="mailto:stefan@bluewhale.de" style="color:#0369a1;text-decoration:underline;">stefan@bluewhale.de</a>.<br/>Vous pouvez \u00E9galement r\u00E9voquer l'acc\u00E8s de SABI \u00E0 votre compte Google via vos <a href="https://myaccount.google.com/permissions" target="_blank" style="color:#0369a1;text-decoration:underline;">autorisations de compte Google</a>.
